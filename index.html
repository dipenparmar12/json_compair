<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Compare Tool</title>
    <script>
        // Home page = CodeMirror 6. ?v=5 opens the legacy CodeMirror 5 version.
        // Query string and hash (shared ?c= links) are kept.
        (function () {
            var params = new URLSearchParams(window.location.search);
            var target = params.get('v') === '5' ? './v5/index.html' : './v6/index.html';
            if (target === './v5/index.html') params.delete('v');
            var query = params.toString();
            window.location.replace(target + (query ? '?' + query : '') + window.location.hash);
        })();
    </script>
</head>
<body>
    <p><a href="./v6/index.html">Open JSON Compare (CodeMirror 6)</a> · <a href="./v5/index.html">CodeMirror 5 (legacy)</a></p>
</body>
</html>
