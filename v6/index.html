      // Check if file is a snapshot file (ZIP or GZ)
      function isSnapshotFile(file) {
        const filename = file.name.toLowerCase();
        const type = file.type.toLowerCase();
        
        // Check by extension
        if (filename.endsWith('.zip') || filename.endsWith('.gz') || filename.endsWith('.gzip')) {
          return true;
        }
        
        // Check by MIME type
        if (type.includes('zip') || type.includes('gzip') || type === 'application/octet-stream') {
          // For octet-stream, also check filename pattern
          if (type === 'application/octet-stream') {
            return filename.includes('snapshot') || filename.endsWith('.zip') || filename.endsWith('.gz');
          }
          return true;
        }
        
        return false;
      }

      // Show drop overlay for snapshot import
      function showDropOverlay() {
        let overlay = document.getElementById('drop-overlay');
        if (!overlay) {
          overlay = document.createElement('div');
          overlay.id = 'drop-overlay';
          overlay.innerHTML = `
            <div class="drop-overlay-content">
              <div class="drop-icon">📥</div>
              <div class="drop-text">Drop snapshot to import</div>
              <div class="drop-subtext">Supports .zip and .gz files</div>
            </div>
          `;
          document.body.appendChild(overlay);
        }
        overlay.classList.add('visible');
      }

      // Hide drop overlay
      function hideDropOverlay() {
        const overlay = document.getElementById('drop-overlay');
        if (overlay) {
          overlay.classList.remove('visible');
        }
      }

      // Setup global document drop zone for snapshots
      function setupGlobalDropZone() {
        let dragCounter = 0;
        
        // Check if dragged items look like snapshot files
        function hasSnapshotFiles(dataTransfer) {
          // Check items if available (modern browsers)
          if (dataTransfer.items && dataTransfer.items.length > 0) {
            for (let i = 0; i < dataTransfer.items.length; i++) {
              const item = dataTransfer.items[i];
              if (item.kind === 'file') {
                const type = item.type.toLowerCase();
                // Only show overlay for ZIP/GZIP types
                if (type.includes('zip') || type.includes('gzip') || type === 'application/octet-stream') {
                  return true;
                }
              }
            }
            return false;
          }
          // Fallback: can't determine type during drag, don't show overlay
          return false;
        }
        
        document.addEventListener('dragenter', (e) => {
          e.preventDefault();
          dragCounter++;
          
          // Only show overlay if dragging snapshot files (ZIP/GZ)
          if (e.dataTransfer.types.includes('Files') && hasSnapshotFiles(e.dataTransfer)) {
            showDropOverlay();
          }
        });
        
        document.addEventListener('dragleave', (e) => {
          e.preventDefault();
          dragCounter--;
          
          if (dragCounter === 0) {
            hideDropOverlay();
          }
        });
        
        document.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'copy';
        });
        
        document.addEventListener('drop', async (e) => {
          e.preventDefault();
          dragCounter = 0;
          hideDropOverlay();
          
          const files = e.dataTransfer.files;
          if (files && files.length > 0) {
            const file = files[0];
            
            // Only handle snapshot files at document level
            // Editor-specific drops are handled by setupEditorDrop
            if (isSnapshotFile(file)) {
              // Check if drop was on an editor (let editor handle it there)
              const target = e.target;
              const isEditorDrop = target.closest('.cm-editor');
              
              if (!isEditorDrop) {
                await handleSnapshotFileDrop(file);
              }
            }
          }
        });
      }

      // Setup drag and drop handlers
      function setupDragDrop() {
        const leftEditor = mergeView.a.dom;
        const rightEditor = mergeView.b.dom;

        setupEditorDrop(leftEditor, 'left');
        setupEditorDrop(rightEditor, 'right');
        
        // Setup global drop zone for snapshots anywhere on page
        setupGlobalDropZone();
      }

      function setupEditorDrop(editorElement, side) {
        editorElement.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.stopPropagation();
          e.dataTransfer.dropEffect = 'copy';
        }, true);

        editorElement.addEventListener('drop', async (e) => {
          e.preventDefault();
          e.stopPropagation();

          const files = e.dataTransfer.files;
          if (files && files.length > 0) {
            await handleFileDrop(files[0], side);
          }
        }, true);
      }

      async function handleFileDrop(file, side) {
        // Check if it's a snapshot file (ZIP or GZ) - handle specially
        if (isSnapshotFile(file)) {
          await handleSnapshotFileDrop(file);
          return;
        }
        
        try {
          const text = await file.text();
          // Dropping a file replaces the whole panel; ingestContent handles
          // type detection, off-thread CSV conversion and sampling.
          await ingestContent(text, side, {});
        } catch (err) {
          showErrorMessage("Failed to read file: " + err.message);
        }
      }

      // Setup paste handlers
      function setupPasteHandlers() {
        mergeView.a.dom.addEventListener('paste', (e) => handlePaste(e, 'left'), true);
        mergeView.b.dom.addEventListener('paste', (e) => handlePaste(e, 'right'), true);
      }

      // ============================================================
      //  Unified content ingest pipeline
      //
      //  Every entry point that brings outside text into a panel — paste
      //  event, Paste button, file drop, manual CSV→JSON — funnels through
      //  ingestContent(). It transforms off the main thread, gates the cost
      //  by size BEFORE the first render, samples very large inputs so the
      //  tab stays alive, and coalesces the follow-up work into one pass.
      // ============================================================

      // Cap on rendered "cells" (~object keys × rows) per panel. Wide CSVs
      // (many columns) sample fewer rows; narrow CSVs sample many. This keeps
      // the MergeView responsive instead of trying to render millions of lines.
      const MAX_RENDER_CELLS_PER_PANEL = 150000;
      // Raw CSV larger than this is always parsed in the worker.
      const OFFTHREAD_CSV_THRESHOLD = 100 * 1024;        // 100 KB
      // Combined content above this turns on collapse-unchanged before render.
      const PROACTIVE_COLLAPSE_BYTES = 300 * 1024;       // 300 KB
      // Combined content above this is no longer auto-saved to localStorage
      // (it cannot fit and the synchronous stringify just causes jank).
      const AUTOSAVE_MAX_BYTES = 4 * 1024 * 1024;        // 4 MB
      // Skip exact CSV/JSON detection (full parse/split) above this size.
      const DETECT_MAX_BYTES = 512 * 1024;               // 512 KB

      // Remember the last raw CSV per side so "Convert all anyway" can re-run.
      const lastRawCsv = { left: null, right: null };
      const ingestRowCapOverride = { left: false, right: false };

      // Yield to the browser so a "Converting…" state can paint before the
      // (potentially heavy) dispatch/render that follows. requestAnimationFrame
      // is throttled (or never fires) in a hidden/background tab, so we race it
      // against a short timeout to guarantee the pipeline always resumes.
      function nextPaint() {
        return new Promise((resolve) => {
          let done = false;
          const finish = () => { if (!done) { done = true; resolve(); } };
          requestAnimationFrame(finish);
          setTimeout(finish, 32);
        });
      }

      // Cheap type sniffing that only inspects a small prefix, so we never
      // split/regex a multi-MB blob just to decide what it is.
      function looksLikeJSONStart(text) {
        const m = text.slice(0, 1024).match(/\S/);
        return !!m && (m[0] === '{' || m[0] === '[');
      }
      function cheapLooksLikeCSV(text) {
        const head = text.slice(0, 65536);
        const nl = head.indexOf('\n');
        const firstLine = nl === -1 ? head : head.slice(0, nl);
        if (!firstLine || /^\s*[{\[]/.test(firstLine)) return false;
        return /[,;\t]/.test(firstLine);
      }
      function countColumns(text) {
        const head = text.slice(0, 65536);
        const nl = head.indexOf('\n');
        const firstLine = nl === -1 ? head : head.slice(0, nl);
        let sep = ',';
        if (firstLine.indexOf('\t') > -1) sep = '\t';
        else if (firstLine.indexOf(';') > -1) sep = ';';
        return Math.max(1, firstLine.split(sep).length);
      }

      function setIngestBusy(message) {
        setDiffSummary('busy', message || 'Processing…');
      }

      // One coalesced follow-up after content lands (replaces the scattered
      // setTimeout(100) blocks each entry point used to run).
      let _afterChangeTimer = null;
      function afterContentChanged(opts = {}) {
        clearTimeout(_afterChangeTimer);
        _afterChangeTimer = setTimeout(() => {
          updateDiffStatus();
          updatePaneButtonVisibility();
          updateClearButtonVisibility();
          if (opts.checkSize) checkContentSizeAndSuggest();
        }, 50);
      }

      // Convert CSV → pretty JSON string off the main thread, sampling rows
      // for very large inputs. Returns { json, builtRows, approxTotalRows, truncated }.
      async function csvToJsonStringOffThread(csvText, { autoSort = false, side } = {}) {
        const columns = countColumns(csvText);
        const override = side ? ingestRowCapOverride[side] : false;
        const maxRows = override
          ? undefined
          : Math.max(1, Math.floor(MAX_RENDER_CELLS_PER_PANEL / columns));

        if (csvText.length > OFFTHREAD_CSV_THRESHOLD) {
          try {
            return await callWorker('csvToJsonString', {
              text: csvText,
              options: { coerceTypes: true },
              maxRows,
              autoSort
            });
          } catch (err) {
            console.warn('[ingest] worker CSV parse failed, using main thread:', err);
          }
        }

        // Main-thread fallback (tiny inputs or worker unavailable).
        let arr = window.CSVUtils.csvToJSON(csvText, { coerceTypes: true });
        const approxTotalRows = arr.length;
        let truncated = false;
        if (maxRows && arr.length > maxRows) {
          arr = arr.slice(0, maxRows);
          truncated = true;
        }
        return {
          json: buildJSONString(arr, { autoSort }),
          builtRows: arr.length,
          approxTotalRows,
          truncated
        };
      }

      // Persistent notice when a large CSV was sampled, with an escape hatch.
      function showSampleNotice(side, builtRows, approxTotalRows) {
        if (!window.PerformanceToast) return;
        const label = side === 'left' ? 'Left' : 'Right';
        PerformanceToast.show(
          `${label}: large CSV — showing first ${builtRows.toLocaleString()} of ~${approxTotalRows.toLocaleString()} rows ` +
          `to keep the browser responsive. ` +
          `<button class="toast-action" onclick="window.__ingestConvertAll('${side}')">Convert all anyway</button>`,
          'warning',
          0 // persist until dismissed
        );
      }

      // Re-ingest the full (un-sampled) CSV for a side after explicit opt-in.
      window.__ingestConvertAll = async function (side) {
        const raw = lastRawCsv[side];
        if (!raw) return;
        if (!confirm('Converting the entire dataset may freeze or crash the tab on very large files. Continue?')) return;
        const existing = document.getElementById('performance-toast');
        if (existing) existing.remove();
        ingestRowCapOverride[side] = true;
        try {
          await ingestContent(raw, side, { forceCsv: true });
        } finally {
          ingestRowCapOverride[side] = false;
        }
      };

      // Enable collapse-unchanged before a large first render so we never pay
      // for rendering every line, then re-render collapsed.
      async function applyProactivePosture(incomingContent, side) {
        const otherLen = (side === 'left' ? mergeView.b : mergeView.a).state.doc.length;
        const total = (incomingContent ? incomingContent.length : 0) + otherLen;
        if (total <= PROACTIVE_COLLAPSE_BYTES) return;

        const collapse = document.getElementById('setting-collapse-unchanged');
        if (collapse && !collapse.checked) {
          collapse.checked = true;
          const quick = document.getElementById('quick-collapse-unchanged');
          if (quick) quick.checked = true;
          SettingsManager.set('collapseUnchanged', true);
          if (canReconfigure()) {
            mergeView.reconfigure(buildReconfigureConfig({
              highlightChanges: document.getElementById('setting-highlight-changes')?.checked ?? true,
              gutter: document.getElementById('setting-gutter')?.checked ?? true,
              collapseUnchanged: true,
              orientation: document.getElementById('setting-orientation')?.value || 'a-b',
              revertControls: document.getElementById('setting-revert-controls')?.value || 'none',
              scanLimit: parseInt(document.getElementById('setting-scan-limit')?.value || '6000', 10),
            }));
          }
        }
      }

      // The single ingest entry point.
      //   opts.forceCsv     – always treat input as CSV (manual convert button)
      //   opts.range        – { from, to } to replace (defaults to whole doc)
      async function ingestContent(rawText, side, opts = {}) {
        if (rawText == null) return;
        const editor = side === 'left' ? mergeView.a : mergeView.b;

        const autoCSV = document.getElementById('auto-csv-conversion')?.checked;
        const autoFormat = document.getElementById('auto-format-json')?.checked;
        const autoSort = document.getElementById('auto-sort-keys')?.checked;

        const from = opts.range ? opts.range.from : 0;
        const to = opts.range ? opts.range.to : editor.state.doc.length;

        let content = rawText;
        let handled = false;

        // 1) JSON-first — only when it actually looks like JSON, so the
        //    Python→JSON regex passes never run over a huge CSV blob.
        if (!opts.forceCsv && (autoCSV || autoFormat || autoSort) && looksLikeJSONStart(rawText)) {
          try {
            const parsed = window.parseFlexibleJSON(rawText);
            content = buildJSONString(parsed, { autoSort });
            handled = true;
          } catch (err) { /* not JSON — fall through to CSV */ }
        }

        // 2) CSV — convert off-thread, sampling very large inputs.
        if (!handled && (opts.forceCsv || (autoCSV && cheapLooksLikeCSV(rawText)))) {
          lastRawCsv[side] = rawText;
          setIngestBusy('Converting CSV…');
          await nextPaint();
          try {
            const res = await csvToJsonStringOffThread(rawText, { autoSort, side });
            content = res.json;
            handled = true;
            if (res.truncated) showSampleNotice(side, res.builtRows, res.approxTotalRows);
            showConversionMessage(res.truncated
              ? `CSV converted (first ${res.builtRows.toLocaleString()} of ~${res.approxTotalRows.toLocaleString()} rows)`
              : 'CSV converted to JSON');
          } catch (err) {
            updateStatus('CSV conversion failed: ' + (err && err.message ? err.message : err));
            showErrorMessage('CSV conversion failed: ' + (err && err.message ? err.message : err));
            return;
          }
        }

        // 3) Proactive performance posture before the heavy render.
        await applyProactivePosture(content, side);
        await nextPaint();

        // 4) One dispatch.
        editor.dispatch({ changes: { from, to, insert: content } });

        // 5) Coalesced follow-up.
        afterContentChanged({ checkSize: true });
      }

      async function handlePaste(e, side) {
        const clipboardData = e.clipboardData || window.clipboardData;
        if (!clipboardData) return;

        const text = clipboardData.getData('text');
        if (!text) return;

        const autoCSV = document.getElementById('auto-csv-conversion')?.checked;
        const autoFormat = document.getElementById('auto-format-json')?.checked;
        const autoSort = document.getElementById('auto-sort-keys')?.checked;

        // No auto-processing enabled → let the editor paste natively.
        if (!(autoCSV || autoFormat || autoSort)) return;

        // Only take over when we will actually transform the content;
        // otherwise plain text pastes natively (preserves caret behaviour).
        const willHandle = looksLikeJSONStart(text) || (autoCSV && cheapLooksLikeCSV(text));
        if (!willHandle) return;

        e.preventDefault();
        e.stopPropagation();

        const editor = side === 'left' ? mergeView.a : mergeView.b;
        const sel = editor.state.selection?.main;
        const range = sel
          ? { from: sel.from, to: sel.to }
          : { from: 0, to: editor.state.doc.length };

        await ingestContent(text, side, { range });
      }

      // Show conversion message
      function showConversionMessage(message) {
        updateStatus(message);
      }

      // Show error message
      function showErrorMessage(message) {
        const errorArea = document.getElementById('conversion-error-area');
        if (errorArea) {
          errorArea.textContent = message;
          errorArea.style.display = 'block';
          setTimeout(() => {
            errorArea.style.display = 'none';
          }, 6000);
        } else {
          updateStatus(message);
        }
      }

      // Load template
      function loadTemplate(templateName) {
        const template = DefaultTemplates[templateName];
        if (!template) return;

        const leftHas = mergeView.a.state.doc.toString().trim().length > 0;
        const rightHas = mergeView.b.state.doc.toString().trim().length > 0;

        if (leftHas || rightHas) {
          if (!confirm("This will replace current content. Continue?")) {
            return;
          }
        }

        mergeView.a.dispatch({
          changes: { from: 0, to: mergeView.a.state.doc.length, insert: template.left }
        });

        mergeView.b.dispatch({
          changes: { from: 0, to: mergeView.b.state.doc.length, insert: template.right }
        });

        updateStatus("Template loaded");
        updateDiffStatus();
      }

      // Clear all content
      async function clearAll() {
        if (!confirm("Clear all content?")) return;

        mergeView.a.dispatch({
          changes: { from: 0, to: mergeView.a.state.doc.length, insert: "" }
        });

        mergeView.b.dispatch({
          changes: { from: 0, to: mergeView.b.state.doc.length, insert: "" }
        });

        // Save cleared content to both branches
        if (window.BranchManager) {
          try {
            const leftBranchId = activeBranches.left;
            const rightBranchId = activeBranches.right;
            
            if (leftBranchId) {
              await window.BranchManager.saveBranch(leftBranchId, '', { source: 'clear-all' });
              branchModified.left = false;
              updateBranchModifiedIndicator('left');
            }
            if (rightBranchId) {
              await window.BranchManager.saveBranch(rightBranchId, '', { source: 'clear-all' });
              branchModified.right = false;
              updateBranchModifiedIndicator('right');
            }
          } catch (err) {
            console.warn('Failed to save cleared branches:', err);
          }
        }

        updateStatus("Content cleared");

        // Recreate merge view to ensure collapsed widgets/placeholders are recalculated
        // This fixes stale "X unchanged lines" placeholders after clearing both panels
        try {
          const currentMergeSettings = loadMergeSettings();
          recreateMergeView(currentMergeSettings, wordWrapEnabled);
        } catch (err) {
          console.warn('Failed to refresh MergeView after clearAll:', err);
        }

        // Hide/refresh Clear All button visibility
        updateClearButtonVisibility();

        updateDiffStatus();
      }

      // Save content to storage (called by auto-save extension)
      function saveContent() {
        const total = mergeView.a.state.doc.length + mergeView.b.state.doc.length;

        if (total > AUTOSAVE_MAX_BYTES) {
          // Too large for localStorage. Skip the synchronous multi-MB
          // toString()+stringify (and the branch-modified reads) that would
          // otherwise run on every change and thrash memory.
          if (!window.__autosaveSkipNotified) {
            window.__autosaveSkipNotified = true;
            if (window.PerformanceToast) {
              PerformanceToast.show(
                'Content is too large to auto-save locally — use Export snapshot to keep a copy.',
                'info', 5000
              );
            }
          }
        } else {
          window.__autosaveSkipNotified = false;
          const leftContent = mergeView.a.state.doc.toString();
          const rightContent = mergeView.b.state.doc.toString();
          try {
            StorageManager.saveToStorage(leftContent, rightContent);
          } catch (e) {
            console.warn('saveToStorage failed during autosave', e);
            if (StorageManager.saveToIndexedDB) {
              StorageManager.saveToIndexedDB(leftContent, rightContent).catch(err => {
                console.error('IndexedDB fallback failed:', err);
              });
            }
          }

          // Mark branches as modified (check in background)
          checkBranchModified('left');
          checkBranchModified('right');
        }

        updateClearButtonVisibility();
        updateDiffStatus();
        updatePaneButtonVisibility();
      }

      // Set the toolbar diff-summary pill: state drives the color, text the label.
      // state is one of: 'idle' | 'same' | 'diff' | 'busy'.
      function setDiffSummary(state, text) {
        const summaryDiv = document.getElementById("diff-summary");
        if (!summaryDiv) return;
        summaryDiv.dataset.state = state;
        summaryDiv.textContent = text;
      }

      // Enable/disable the prev/next diff buttons based on the chunk count.
      function updateDiffNavState() {
        const count = mergeView?.chunks?.length || 0;
        const prevBtn = document.getElementById('btn-diff-prev');
        const nextBtn = document.getElementById('btn-diff-next');
        if (prevBtn) prevBtn.disabled = count === 0;
        if (nextBtn) nextBtn.disabled = count === 0;
      }

      // Jump the focused editor (default: right pane) to the next/previous change,
      // using CodeMirror merge's own chunk-navigation commands.
      function goToDiff(dir) {
        if (!mergeView) return;
        const target = mergeView.a.hasFocus ? mergeView.a : mergeView.b;
        (dir > 0 ? goToNextChunk : goToPreviousChunk)(target);
        target.focus();
      }

      // Update diff status. The count is taken straight from mergeView.chunks (the
      // authoritative, already-computed line-chunk list that the view renders), so
      // the number always matches the screen and we avoid a second full
      // diff_match_patch pass (and the >100KB web-worker round-trip) on every edit.
      function updateDiffStatus() {
        const leftContent = mergeView.a.state.doc.toString().trim();
        const rightContent = mergeView.b.state.doc.toString().trim();

        if (!leftContent || !rightContent) {
          setDiffSummary('idle', 'Add content to both panels to compare');
          updateDiffNavState();
          return;
        }

        if (leftContent === rightContent) {
          setDiffSummary('same', 'No differences');
          updateDiffNavState();
          return;
        }

        // Optional viewport-diff mode computes its own (visible-area) count.
        if (viewportDiffManager?.enabled) {
          const result = viewportDiffManager.calculateViewportDiff();
          if (result) {
            setDiffSummary('diff', viewportDiffManager.getDiffStatusMessage() || 'Calculating…');
            updateDiffNavState();
            return;
          }
        }

        const chunkCount = mergeView?.chunks?.length || 0;
        if (chunkCount === 0) {
          setDiffSummary('same', 'No differences');
        } else {
          setDiffSummary('diff', `${chunkCount} changed block${chunkCount !== 1 ? 's' : ''}`);
        }
        updateDiffNavState();
      }

      // Update status message (transient, neutral styling).
      function updateStatus(message) {
        setDiffSummary('idle', message);
      }

      // Update clear button visibility
      function updateClearButtonVisibility() {
        const btnClearAll = document.getElementById("btn-clear-all");
        if (!btnClearAll) return;

        const leftContent = mergeView.a.state.doc.toString().trim();
        const rightContent = mergeView.b.state.doc.toString().trim();

        btnClearAll.style.display = (leftContent || rightContent) ? "inline-block" : "none";
      }

      // Initialize when DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeApp);
      } else {
        initializeApp();
      }
    </script>
  </body>
</html>
